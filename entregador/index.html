
<!DOCTYPE html>
<!-- ObraExpress: teste de deploy automático - 02/08/2026 -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ObraExpress - Painel do Entregador</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ObraExpress Entregador">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--laranja:#E65100;--laranja-escuro:#BF360C;--bg:#F5F5F5;--branco:#fff;--texto:#212121;--texto-sec:#757575;--borda:#E0E0E0;--verde:#2E7D32;--azul:#1565C0;--roxo:#7B1FA2}
body{background:var(--bg);color:var(--texto)}
.header{background:var(--laranja);color:var(--branco);padding:16px;position:sticky;top:0;z-index:100}
.header h1{font-size:20px;font-weight:700}
.header .sub{font-size:12px;opacity:.8}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;margin:8px 0}
.btn-primary{background:var(--laranja);color:var(--branco)}
.btn-success{background:var(--verde);color:var(--branco)}
.btn-danger{background:#C62828;color:var(--branco)}
.btn-sm{padding:10px;font-size:13px;margin:4px 0}
.btn-outline{background:var(--branco);color:var(--laranja);border:2px solid var(--laranja)}
.form-group{margin-bottom:12px;padding:0 16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--texto-sec);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid var(--borda);border-radius:10px;font-size:15px;outline:none}
.form-group input:focus{border-color:var(--laranja)}
.card{background:var(--branco);margin:8px 16px;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:15px;margin-bottom:4px}
.card .meta{font-size:12px;color:var(--texto-sec)}
.card .valor{font-size:22px;font-weight:800;color:var(--verde);margin:8px 0}
.order-item{background:var(--branco);margin:8px 16px;padding:12px 16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.order-item .status{font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px;display:inline-block;margin-bottom:4px}
.order-item .total{font-size:16px;font-weight:700;color:var(--laranja)}
.order-item .actions{display:flex;gap:8px;margin-top:8px}
.order-item .actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.order-item .valor-entrega{font-size:24px;font-weight:800;color:var(--verde);text-align:center;margin:8px 0}
.order-item .info-rotas{font-size:13px;color:var(--texto-sec);margin:8px 0;line-height:1.6}
.tabs{display:flex;background:var(--branco);margin:12px 16px;border-radius:12px;overflow:hidden}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--texto-sec)}
.tab.active{background:var(--laranja);color:var(--branco)}
.empty-state{text-align:center;padding:40px 20px;color:var(--texto-sec)}
.saldo-card{background:var(--verde);color:var(--branco);margin:8px 16px;padding:16px;border-radius:16px;text-align:center}
.saldo-card .valor{font-size:36px;font-weight:800;margin:8px 0}
.saldo-card .label{font-size:12px;opacity:.8}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#37474F;color:var(--branco);padding:12px 24px;border-radius:12px;font-size:14px;z-index:999;display:none}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<div id="page-login" class="pages active" style="display:block">
  <div class="header"><h1>🛵 ObraExpress - Entregador</h1><div class="sub">Painel do motoboy</div></div>
  <div style="padding:24px 16px">
    <div id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="motoboy@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="login-senha" placeholder="Sua senha"></div>
      <button class="btn btn-primary" onclick="loginEntregador()">Entrar</button>
      <div style="text-align:center;padding:16px;font-size:13px;color:var(--texto-sec)">Não tem conta? <button type="button" style="background:none;border:0;color:var(--laranja);font-weight:600;cursor:pointer;padding:0;font-size:13px" onclick="showCadastro()">Cadastre-se como entregador</button></div>
    </div>
    <div id="cadastro-form" style="display:none">
      <div class="form-group"><label>Nome completo</label><input type="text" id="cad-nome" placeholder="Seu nome"></div>
      <div class="form-group"><label>CPF</label><input type="text" id="cad-cpf" placeholder="000.000.000-00"></div>
      <div class="form-group"><label>Email</label><input type="email" id="cad-email" placeholder="motoboy@email.com"></div>
      <div class="form-group"><label>Telefone</label><input type="text" id="cad-telefone" placeholder="(99) 99999-9999"></div>
      <div class="form-group"><label>Veículo</label><input type="text" id="cad-veiculo" placeholder="Moto, bicicleta, carro"></div>
      <div class="form-group"><label>Placa (opcional)</label><input type="text" id="cad-placa" placeholder="ABC-1234"></div>
      <div class="form-group"><label>Chave Pix (para receber)</label><input type="text" id="cad-pix" placeholder="CPF, email ou telefone"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="cad-senha" placeholder="Crie uma senha"></div>
      <button class="btn btn-primary" onclick="cadastroEntregador()">Cadastrar</button>
      <div style="text-align:center;padding:16px;font-size:13px;color:var(--texto-sec)">Já tem conta? <a style="color:var(--laranja);font-weight:600;cursor:pointer" onclick="showLogin()">Fazer login</a></div>
    </div>
  </div>
</div>

<div id="page-dashboard" class="pages" style="display:none">
  <div class="header"><h1>🛵 <span id="entregador-header-name">Painel</span></h1><div class="sub">Suas entregas e saldo</div></div>
  
  <div id="saldo-container"></div>
  <div id="gps-status" class="card" style="border-left:4px solid var(--azul);display:none"></div>
  
  <div class="tabs">
    <button class="tab active" onclick="switchTab('disponiveis',this)">🆕 Disponíveis</button>
    <button class="tab" onclick="switchTab('minhas-entregas',this)">🛵 Minhas</button>
    <button class="tab" onclick="switchTab('perfil',this)">👤 Perfil</button>
  </div>
  <div id="tab-disponiveis"></div>
  <div id="tab-minhas-entregas" style="display:none"></div>
  <div id="tab-perfil" style="display:none"></div>
</div>

<script>
const API = '';
let token = localStorage.getItem('entregador_token');
let entregador = JSON.parse(localStorage.getItem('entregador') || 'null');
let gpsWatchId = null;
let ultimaLocalizacao = null;

function atualizarGpsStatus(html, mostrar=true){
  const el=document.getElementById('gps-status');
  if(el){el.innerHTML=html;el.style.display=mostrar?'block':'none';}
}

function iniciarGPS(){
  if(!entregador || !token)return;
  if(!navigator.geolocation){
    atualizarGpsStatus('⚠️ Este celular não oferece localização GPS.'); return;
  }
  atualizarGpsStatus('📍 <strong>GPS ativando...</strong><br><small>Permita o acesso à localização quando o celular pedir.</small>');
  gpsWatchId=navigator.geolocation.watchPosition(async pos=>{
    const {latitude,longitude,accuracy}=pos.coords;
    ultimaLocalizacao={latitude,longitude,accuracy};
    const r=await api('/api/entregadores/'+entregador.id+'/localizacao',{method:'PUT',body:JSON.stringify({latitude,longitude})});
    if(r.error){atualizarGpsStatus('⚠️ Não foi possível atualizar o GPS.');return;}
    atualizarGpsStatus('✅ <strong>GPS ativo</strong><br><small>Localização atualizada • precisão aproximada: '+Math.round(accuracy||0)+' m</small>');
  }, err=>{
    const mensagens={1:'Permissão de localização negada. Ative o GPS nas configurações do celular.',2:'Não foi possível localizar o celular.',3:'O GPS demorou para responder.'};
    atualizarGpsStatus('⚠️ '+(mensagens[err.code]||'Verifique o GPS do celular.'));
  }, {enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}

function pararGPS(){
  if(gpsWatchId!==null && navigator.geolocation){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
async function api(path,opts={}){const h={'Content-Type':'application/json'};if(token)h['Authorization']='Bearer '+token;try{const r=await fetch(API+path,{...opts,headers:h});return await r.json()}catch(e){return{error:e.message}}}

function showCadastro(){document.getElementById('login-form').style.display='none';document.getElementById('cadastro-form').style.display='block'}
function showLogin(){document.getElementById('login-form').style.display='block';document.getElementById('cadastro-form').style.display='none'}

async function loginEntregador(){
  const email=document.getElementById('login-email').value;
  const senha=document.getElementById('login-senha').value;
  if(!email||!senha)return toast('Preencha email e senha');
  const r=await api('/api/entregadores/login',{method:'POST',body:JSON.stringify({email,senha})});
  if(r.error)return toast(r.error);
  token=r.token;entregador=r.entregador;
  localStorage.setItem('entregador_token',token);localStorage.setItem('entregador',JSON.stringify(entregador));
  document.getElementById('entregador-header-name').textContent=entregador.nome;
  toast('Bem-vindo, '+entregador.nome+'!');entrarDashboard();
  iniciarGPS();
}

async function cadastroEntregador(){
  const d={
    nome:document.getElementById('cad-nome').value,
    cpf:document.getElementById('cad-cpf').value,
    email:document.getElementById('cad-email').value,
    telefone:document.getElementById('cad-telefone').value,
    veiculo:document.getElementById('cad-veiculo').value,
    placa:document.getElementById('cad-placa').value,
    chave_pix:document.getElementById('cad-pix').value,
    senha:document.getElementById('cad-senha').value
  };
  if(!d.nome||!d.email||!d.senha)return toast('Preencha nome, email e senha');
  const r=await api('/api/entregadores/cadastro',{method:'POST',body:JSON.stringify(d)});
  if(r.error)return toast(r.error);
  token=r.token;entregador=r.entregador;
  localStorage.setItem('entregador_token',token);localStorage.setItem('entregador',JSON.stringify(entregador));
  document.getElementById('entregador-header-name').textContent=entregador.nome;
  toast('Cadastro realizado!');entrarDashboard();
  iniciarGPS();
}

function entrarDashboard(){
  document.getElementById('page-login').style.display='none';
  document.getElementById('page-login').classList.remove('active');
  document.getElementById('page-dashboard').style.display='block';
  document.getElementById('page-dashboard').classList.add('active');
  carregarSaldo();
  carregarDisponiveis();
}

function switchTab(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['disponiveis','minhas-entregas','perfil'].forEach(t=>document.getElementById('tab-'+t).style.display=t===tab?'block':'none');
  if(tab==='disponiveis')carregarDisponiveis();
  if(tab==='minhas-entregas')carregarMinhasEntregas();
  if(tab==='perfil')carregarPerfil();
}

async function carregarSaldo(){
  const el=document.getElementById('saldo-container');
  const r=await api('/api/entregadores/'+entregador.id+'/saldo');
  const saldo=r.saldo||{saldo:0,total_ganho:0,total_sacado:0};
  el.innerHTML=`
    <div class="saldo-card">
      <div class="label">💰 Saldo Disponível</div>
      <div class="valor">R$ ${saldo.saldo.toFixed(2)}</div>
      <div style="display:flex;justify-content:space-around;font-size:12px;opacity:.8;margin-top:8px">
        <span>✅ Total ganho: R$ ${saldo.total_ganho.toFixed(2)}</span>
        <span>💳 Sacado: R$ ${saldo.total_sacado.toFixed(2)}</span>
      </div>
    </div>
  `;
}

// ============ PEDIDOS DISPONÍVEIS ============
async function carregarDisponiveis(){
  const el=document.getElementById('tab-disponiveis');
  const r=await api('/api/pedidos/disponiveis');
  if(!r.pedidos||r.pedidos.length===0){
    el.innerHTML=`<div class="empty-state"><div class="icon" style="font-size:48px">🆕</div><h3>Nenhum pedido disponível</h3><p>Assim que uma loja liberar, aparece aqui</p></div>`;
    return;
  }
  el.innerHTML=r.pedidos.map(p=>`
    <div class="order-item">
      <div style="text-align:center">
        <span class="status" style="background:#E8F5E9;color:var(--verde)">📦 Pronto para coleta</span>
      </div>
      <h3 style="text-align:center;margin:8px 0">🏪 ${p.loja_nome}</h3>
      <div class="valor-entrega">💰 R$ ${(p.valor_motoboy||0).toFixed(2)}</div>
      
      <div class="info-rotas">
        <strong>📍 Coleta:</strong> ${p.loja_endereco||'Não informado'}<br>
        <strong>📍 Entrega:</strong> ${p.cliente_endereco||p.endereco_entrega||'Não informado'}<br>
        <strong>👤 Cliente:</strong> ${p.cliente_nome} ${p.cliente_telefone ? '• 📞 '+p.cliente_telefone : ''}<br>
        <strong>📦 ${p.tipo_entrega==='entrega'?'🛵 Entrega':'🏪 Retirada'}</strong>
      </div>
      
      <div class="actions">
        <button style="background:var(--verde);color:var(--branco);font-size:15px" onclick="aceitarPedido(${p.id})">✅ Aceitar</button>
      </div>
    </div>
  `).join('');
}

async function aceitarPedido(id){
  const r=await api('/api/pedidos/'+id+'/aceitar',{method:'PUT'});
  if(r.error)return toast(r.error);
  toast('✅ Pedido aceito! Vá até a loja.');
  carregarDisponiveis();
  carregarMinhasEntregas();
  carregarSaldo();
  switchTab('minhas-entregas',document.querySelector('.tab:nth-child(2)'));
}

// ============ MINHAS ENTREGAS ============
async function carregarMinhasEntregas(){
  const el=document.getElementById('tab-minhas-entregas');
  const r=await api('/api/pedidos/entregador/'+entregador.id);
  if(!r.pedidos||r.pedidos.length===0){
    el.innerHTML=`<div class="empty-state"><div class="icon" style="font-size:48px">🛵</div><h3>Nenhuma entrega ainda</h3></div>`;
    return;
  }
  const statusLabel={'em_coleta':'📍 Indo buscar na loja','saiu_entrega':'🛵 A caminho do cliente','entregue':'✅ Entregue','separado':'📦 Na loja'};
  el.innerHTML=r.pedidos.map(p=>`
    <div class="order-item">
      <span class="status" style="background:${p.status==='entregue'?'#E8F5E9':'#F3E5F5'}22;color:${p.status==='entregue'?'var(--verde)':'var(--roxo)'}">${statusLabel[p.status]||p.status}</span>
      <h3 style="margin:8px 0">🏪 ${p.loja_nome}</h3>
      <div class="meta">👤 ${p.cliente_nome}</div>
      <div class="meta">📍 ${p.endereco_entrega||p.cliente_endereco||'Retirada'}</div>
      <div class="valor" style="font-size:18px">💰 R$ ${(p.valor_motoboy||0).toFixed(2)}</div>
      
      ${p.status==='em_coleta' ? `
        <div class="actions" style="flex-direction:column">
          <div style="text-align:center;margin-bottom:8px">
            <div style="font-size:32px;margin-bottom:4px">📍</div>
            <p style="font-size:14px;font-weight:600;color:var(--verde);align-items:center;display:flex;gap:4px;justify-content:center">Pedido aceito! Vá até a loja</p>
          </div>
          <button style="background:var(--azul);color:var(--branco);padding:12px;border:none;border-radius:8px;font-weight:600;margin-bottom:8px" onclick="abrirGPS(${p.loja_latitude},${p.loja_longitude},'${p.loja_nome}')">📍 Ir até a loja (GPS)</button>
          <div style="margin:8px 0;padding:12px;background:var(--bg);border-radius:12px;text-align:center;border:1px dashed var(--borda)">
            <p style="font-size:13px;font-weight:600;margin-bottom:8px">📸 Conferiu os itens na loja? Tire a foto da coleta</p>
            <input type="file" accept="image/*" capture="environment" id="foto-coleta-${p.id}" style="width:100%;margin-bottom:8px;padding:8px">
            <button style="background:var(--laranja);color:var(--branco);width:100%;padding:12px;border:none;border-radius:8px;font-weight:600;font-size:15px" onclick="enviarFotoColeta(${p.id})">📸 Coletar e Sair pra Entrega</button>
          </div>
          <button style="background:var(--vermelho);color:var(--branco);padding:10px;border:none;border-radius:8px;font-size:14px;margin-top:4px" onclick="recusarPedido(${p.id})">❌ Recusar pedido</button>
        </div>
      ` : ''}
      
      ${p.status==='saiu_entrega' ? `
        <div class="actions" style="flex-direction:column">
          ${p.foto_coleta ? `<div style="text-align:center;margin-bottom:8px"><img src="${p.foto_coleta}" style="width:100%;max-width:200px;border-radius:8px"><div class="meta">✅ Coleta registrada • Pedido conferido</div></div>` : ''}
          <div style="text-align:center;margin:4px"><div style="font-size:32px">🛵</div><p style="font-size:14px;font-weight:600;color:var(--verde)">A caminho do cliente!</p></div>
          <button style="background:var(--verde);color:var(--branco);padding:12px;border:none;border-radius:8px;font-weight:600;margin:8px 0" onclick="abrirGPS(${p.cliente_latitude},${p.cliente_longitude},'${p.cliente_nome}')">📍 Ir até o cliente (GPS)</button>
          <div style="margin:8px 0;padding:12px;background:var(--bg);border-radius:12px;text-align:center;border:1px dashed var(--borda)">
            <p style="font-size:13px;font-weight:600;margin-bottom:8px">📸 Tire a foto da entrega para finalizar</p>
            <input type="file" accept="image/*" capture="environment" id="foto-entrega-${p.id}" style="width:100%;margin-bottom:8px;padding:8px">
            <button style="background:var(--verde);color:var(--branco);width:100%;padding:12px;border:none;border-radius:8px;font-weight:600;font-size:15px" onclick="enviarFotoEntrega(${p.id})">✅ Finalizar Entrega</button>
          </div>
        </div>
      ` : ''}
      
      ${p.status==='entregue' ? `
        <div class="meta" style="color:var(--verde);font-weight:600;text-align:center">
          ✅ Entrega finalizada • R$ ${(p.valor_motoboy||0).toFixed(2)} creditado
        </div>
        ${p.foto_entrega ? `<div style="text-align:center;margin-top:4px"><img src="${p.foto_entrega}" style="width:100%;max-width:200px;border-radius:8px"><div class="meta">📸 Foto da entrega</div></div>` : ''}
      ` : ''}
    </div>
  `).join('');
}

function abrirGPS(lat, lng, nome){
  if(!lat||!lng)return toast('Localização não disponível');
  const url=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
  window.open(url,'_blank');
}

async function enviarFotoColeta(id){
  const input=document.getElementById('foto-coleta-'+id);
  if(!input.files||!input.files[0])return toast('Tire a foto primeiro');
  const foto=await lerFotoComoBase64(input.files[0]);
  const r=await api('/api/pedidos/'+id+'/foto-coleta',{method:'PUT',body:JSON.stringify({foto})});
  if(r.error)return toast(r.error);
  toast('📸 Coleta registrada! Vá entregar.');
  carregarMinhasEntregas();
}

async function enviarFotoEntrega(id){
  const input=document.getElementById('foto-entrega-'+id);
  if(!input.files||!input.files[0])return toast('Tire a foto da entrega');
  const foto=await lerFotoComoBase64(input.files[0]);
  const r=await api('/api/pedidos/'+id+'/finalizar',{method:'PUT',body:JSON.stringify({foto})});
  if(r.error)return toast(r.error);
  toast('✅ Entrega finalizada! R$ '+r.creditado.toFixed(2)+' creditados na sua conta!');
  carregarMinhasEntregas();
  carregarSaldo();
}

async function recusarPedido(id){
  if(!confirm('Tem certeza que quer recusar?'))return;
  const r=await api('/api/pedidos/'+id+'/recusar',{method:'PUT'});
  if(r.error)return toast(r.error);
  toast('❌ Pedido recusado');
  carregarMinhasEntregas();
  carregarDisponiveis();
  carregarSaldo();
}

function lerFotoComoBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

// ============ PERFIL ============
function carregarPerfil(){
  const el=document.getElementById('tab-perfil');
  el.innerHTML=`
    <div class="card">
      <h3>👤 ${entregador.nome}</h3>
      <div class="meta">📧 ${entregador.email}</div>
      <div class="meta">🛵 ${entregador.veiculo||'Não informado'}</div>
      <div class="meta">💳 Pix: ${entregador.chave_pix||'Não cadastrada'}</div>
    </div>
    <div class="card">
      <h3>📊 Estatísticas</h3>
      <div class="meta" id="stats-entregador">Carregando...</div>
    </div>
    <button class="btn btn-outline" onclick="sair()" style="margin:16px">🚪 Sair</button>
    <button class="btn" onclick="excluirMinhaConta()" style="margin:0 16px 16px;color:#c62828;border:1px solid #c62828">🗑️ Excluir minha conta</button>
  `;
  api('/api/entregadores/'+entregador.id+'/saldo').then(r=>{
    if(r.saldo){
      document.getElementById('stats-entregador').innerHTML=`
        💰 Saldo atual: R$ ${r.saldo.saldo.toFixed(2)}<br>
        ✅ Total ganho: R$ ${r.saldo.total_ganho.toFixed(2)}<br>
        💳 Total sacado: R$ ${r.saldo.total_sacado.toFixed(2)}
      `;
    }
  });
}

async function excluirMinhaConta(){
  if(!confirm('Excluir sua conta e todos os seus dados? Esta ação não pode ser desfeita.'))return;
  const r=await api('/api/entregadores/'+entregador.id,{method:'DELETE'});
  if(r.error)return toast(r.error);
  localStorage.removeItem('entregador_token');localStorage.removeItem('entregador');
  alert('Conta excluída. Você poderá se cadastrar novamente.'); location.reload();
}

function sair(){
  localStorage.removeItem('entregador_token');
  localStorage.removeItem('entregador');
  token=null;entregador=null;
  document.getElementById('page-dashboard').style.display='none';
  document.getElementById('page-login').style.display='block';
}

// Init
if(entregador){
  document.getElementById('entregador-header-name').textContent=entregador.nome;
  entrarDashboard();
  iniciarGPS();
}
</script>

if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

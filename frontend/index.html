<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ObraExpress - Materiais de Construção</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ObraExpress">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--laranja:#E65100;--laranja-escuro:#BF360C;--laranja-claro:#FFF3E0;--cinza:#37474F;--bg:#F5F5F5;--branco:#fff;--texto:#212121;--texto-sec:#757575;--borda:#E0E0E0;--verde:#2E7D32;--vermelho:#C62828}
body{background:var(--bg);color:var(--texto);overflow-x:hidden}
.pages{display:none;min-height:100vh;padding-bottom:80px}
.pages.active{display:block}
/* HEADER */
.header{background:var(--laranja);color:var(--branco);padding:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:20px;font-weight:700}
.header .sub{font-size:12px;opacity:.8}
.header-row{display:flex;align-items:center;gap:12px}
.header-row .back{font-size:24px;cursor:pointer;background:none;border:none;color:var(--branco)}
.header-row h1{flex:1;font-size:18px}

/* SEARCH */
.search-box{background:var(--branco);margin:12px 16px;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search-box input{flex:1;border:none;outline:none;font-size:15px;background:transparent}
.search-box .icon{font-size:20px;color:var(--texto-sec)}

/* CATEGORIES */
.cat-scroll{overflow-x:auto;padding:0 16px;margin:12px 0;white-space:nowrap;-webkit-overflow-scrolling:touch}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-item{display:inline-flex;flex-direction:column;align-items:center;margin-right:12px;padding:12px 16px;background:var(--branco);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;min-width:80px;transition:.2s}
.cat-item:active{transform:scale(.95)}
.cat-item .icon{font-size:28px;margin-bottom:4px}
.cat-item .name{font-size:12px;font-weight:600;color:var(--texto-sec)}

/* STORE CARD */
.store-card{background:var(--branco);border-radius:16px;margin:8px 16px;padding:16px;display:flex;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:.2s}
.store-card:active{transform:scale(.98)}
.store-logo{width:56px;height:56px;border-radius:12px;background:var(--laranja-claro);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.store-info{flex:1}
.store-info h3{font-size:15px;font-weight:600;margin-bottom:2px}
.store-info .meta{font-size:12px;color:var(--texto-sec);margin-bottom:4px}
.store-info .tags{display:flex;gap:4px;flex-wrap:wrap}
.store-info .tag{background:var(--laranja-claro);color:var(--laranja);padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600}

/* PRODUCT */
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.product-card{background:var(--branco);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.product-img{width:100%;height:140px;background:var(--laranja-claro);display:flex;align-items:center;justify-content:center;font-size:48px}
.product-info{padding:12px}
.product-info h4{font-size:14px;font-weight:600;margin-bottom:2px}
.product-info .loja-nome{font-size:11px;color:var(--texto-sec);margin-bottom:4px}
.product-info .preco{font-size:16px;font-weight:700;color:var(--laranja);margin-bottom:8px}
.product-info .btn-add{width:100%;padding:8px;background:var(--laranja);color:var(--branco);border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.product-info .btn-add:active{transform:scale(.95)}

/* BUTTONS */
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:.2s;text-align:center;text-decoration:none}
.btn-primary{background:var(--laranja);color:var(--branco)}
.btn-primary:active{transform:scale(.98)}
.btn-secondary{background:var(--branco);color:var(--laranja);border:2px solid var(--laranja)}
.btn-success{background:var(--verde);color:var(--branco)}
.btn-danger{background:var(--vermelho);color:var(--branco)}
.btn-sm{padding:10px;font-size:14px;border-radius:8px}

/* FORM */
.form-group{margin-bottom:16px;padding:0 16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--texto-sec);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid var(--borda);border-radius:10px;font-size:15px;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--laranja)}
.form-group textarea{resize:vertical;min-height:80px}

/* CART */
.cart-item{background:var(--branco);margin:8px 16px;padding:12px 16px;border-radius:12px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cart-item .info{flex:1}
.cart-item .info h4{font-size:14px}
.cart-item .info .preco{font-size:13px;color:var(--laranja);font-weight:600}
.cart-item .qty{display:flex;align-items:center;gap:8px}
.cart-item .qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--borda);background:var(--branco);font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cart-item .qty span{font-weight:600;min-width:20px;text-align:center}
.cart-resumo{background:var(--branco);margin:16px;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cart-resumo .row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}
.cart-resumo .total{font-size:18px;font-weight:700;color:var(--laranja);border-top:1px solid var(--borda);padding-top:8px}

/* ORDER */
.order-card{background:var(--branco);margin:8px 16px;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.order-card .status{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:8px}
.status-aguardando{background:#FFF8E1;color:#F57F17}
.status-confirmado{background:#E3F2FD;color:#1565C0}
.status-saiu_entrega{background:#E8F5E9;color:#2E7D32}
.status-entregue{background:#F3E5F5;color:#7B1FA2}
.status-cancelado{background:#FFEBEE;color:#C62828}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--branco);display:flex;justify-content:space-around;padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:200}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 12px;border:none;background:none;color:var(--texto-sec);font-size:11px;transition:.2s;position:relative}
.nav-item.active{color:var(--laranja)}
.nav-item .icon{font-size:22px}
.nav-item .badge{position:absolute;top:-2px;right:4px;background:var(--vermelho);color:var(--branco);font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700}

/* TABS */
.tabs{display:flex;background:var(--branco);margin:0 16px;border-radius:12px;overflow:hidden;margin-bottom:12px}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--texto-sec);transition:.2s}
.tab.active{background:var(--laranja);color:var(--branco)}

/* MISC */
.empty-state{text-align:center;padding:60px 20px;color:var(--texto-sec)}
.empty-state .icon{font-size:64px;margin-bottom:16px}
.empty-state h3{font-size:18px;margin-bottom:8px}
.empty-state p{font-size:14px}

.section-title{font-size:16px;font-weight:700;padding:12px 16px 8px}
.section-title span{color:var(--laranja)}

/* LOGIN/REGISTER TOGGLE */
.auth-toggle{text-align:center;padding:16px;font-size:13px;color:var(--texto-sec)}
.auth-toggle a{color:var(--laranja);font-weight:600;cursor:pointer}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--texto-sec)}
.loading .spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--borda);border-top:3px solid var(--laranja);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--cinza);color:var(--branco);padding:12px 24px;border-radius:12px;font-size:14px;z-index:999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* AVALIAÇÃO */
.estrelas{display:flex;gap:4px;font-size:24px;cursor:pointer}
.estrelas span{color:#FFB300}
.estrelas span.vazia{color:#E0E0E0}

/* RESPONSIVE */
@media(max-width:360px){.product-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- ============ HOME ============ -->
<div id="page-home" class="pages active">
  <div class="header">
    <h1>🏗️ ObraExpress</h1>
    <div class="sub">Materiais de construção na sua obra</div>
  </div>
  <div class="search-box" onclick="navigate('busca')">
    <span class="icon">🔍</span>
    <input type="text" placeholder="Buscar produtos ou lojas..." readonly>
  </div>
  <div class="section-title">Categorias</div>
  <div class="cat-scroll" id="cat-list"></div>
  <div class="section-title">Lojas <span>próximas</span></div>
  <div id="store-list"></div>
</div>

<!-- ============ BUSCA ============ -->
<div id="page-busca" class="pages">
  <div class="header">
    <div class="header-row">
      <button class="back" onclick="navigate('home')">‹</button>
      <div class="search-box" style="margin:0;flex:1;box-shadow:none">
        <span class="icon">🔍</span>
        <input type="text" id="search-input" placeholder="Buscar produtos..." oninput="searchProducts()">
      </div>
    </div>
  </div>
  <div id="search-results"></div>
</div>

<!-- ============ LOJA DETALHE ============ -->
<div id="page-loja" class="pages">
  <div class="header">
    <div class="header-row">
      <button class="back" onclick="navigate('home')">‹</button>
      <h1 id="loja-nome-header">Loja</h1>
    </div>
  </div>
  <div id="loja-info"></div>
  <div class="section-title">Produtos</div>
  <div id="produtos-list" class="product-grid"></div>
</div>

<!-- ============ CARRINHO ============ -->
<div id="page-cart" class="pages">
  <div class="header">
    <div class="header-row">
      <button class="back" onclick="navigate('home')">‹</button>
      <h1>🛒 Carrinho</h1>
    </div>
  </div>
  <div id="cart-content"></div>
</div>

<!-- ============ CHECKOUT ============ -->
<div id="page-checkout" class="pages">
  <div class="header">
    <div class="header-row">
      <button class="back" onclick="navigate('cart')">‹</button>
      <h1>Finalizar Pedido</h1>
    </div>
  </div>
  <div style="padding:16px">
    <div class="form-group">
      <label>Forma de entrega</label>
      <select id="tipo-entrega" onchange="toggleTipoEntrega()">
        <option value="entrega">🛵 Entrega</option>
        <option value="retirada">🏪 Retirar na loja</option>
      </select>
    </div>
    <div id="endereco-group" class="form-group">
      <label>Endereço de entrega</label>
      <input type="text" id="endereco-entrega" placeholder="Rua, número, bairro">
    </div>
    <div class="form-group">
      <label>Observação</label>
      <textarea id="observacao" placeholder="Ex: Após as 14h, tocar interfone..."></textarea>
    </div>
    <div class="form-group">
      <label>Forma de pagamento</label>
      <select id="forma-pagamento">
        <option value="dinheiro">💵 Dinheiro</option>
        <option value="pix">📱 Pix</option>
        <option value="cartao">💳 Cartão (na entrega)</option>
      </select>
    </div>
    <div id="checkout-resumo" class="cart-resumo"></div>
    <button class="btn btn-primary" onclick="finalizarPedido()" style="margin:16px 0">✅ Confirmar Pedido</button>
  </div>
</div>

<!-- ============ PEDIDOS ============ -->
<div id="page-pedidos" class="pages">
  <div class="header">
    <div class="header-row">
      <button class="back" onclick="navigate('home')">‹</button>
      <h1>📋 Meus Pedidos</h1>
    </div>
  </div>
  <div id="pedidos-list"></div>
</div>

<!-- ============ LOGIN / CADASTRO ============ -->
<div id="page-login" class="pages">
  <div class="header">
    <div class="header-row">
      <button class="back" onclick="navigate('home')">‹</button>
      <h1 id="auth-title">Entrar</h1>
    </div>
  </div>
  <div style="padding:24px 16px">
    <div id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="Sua senha">
      </div>
      <button class="btn btn-primary" onclick="loginCliente()">Entrar</button>
      <div class="auth-toggle">Não tem conta? <a onclick="showCadastro()">Cadastre-se</a></div>
    </div>
    <div id="cadastro-form" style="display:none">
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="cad-nome" placeholder="Seu nome">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="cad-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Telefone</label>
        <input type="text" id="cad-telefone" placeholder="(98) 99999-9999">
      </div>
      <div class="form-group">
        <label>Endereço</label>
        <input type="text" id="cad-endereco" placeholder="Rua, número, bairro">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="cad-senha" placeholder="Crie uma senha">
      </div>
      <button class="btn btn-primary" onclick="cadastroCliente()">Criar Conta</button>
      <div class="auth-toggle">Já tem conta? <a onclick="showLogin()">Fazer login</a></div>
    </div>
  </div>
</div>

<!-- ============ BOTTOM NAV ============ -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="navigate('home')">
    <span class="icon">🏠</span> Início
  </button>
  <button class="nav-item" onclick="navigate('busca')">
    <span class="icon">🔍</span> Buscar
  </button>
  <button class="nav-item" id="nav-cart" onclick="navigate('cart')">
    <span class="icon">🛒</span> Carrinho
    <span class="badge" id="cart-badge" style="display:none">0</span>
  </button>
  <button class="nav-item" onclick="navigate('pedidos')">
    <span class="icon">📋</span> Pedidos
  </button>
  <button class="nav-item" id="nav-user" onclick="navigate('login')">
    <span class="icon">👤</span> <span id="nav-user-text">Entrar</span>
  </button>
</div>

<script>
// ============ STATE ============
const API = '';
let token = localStorage.getItem('token');
let usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
let cart = JSON.parse(localStorage.getItem('cart') || '[]');
let currentLoja = null;
let categorias = [];

// ============ NAVIGATION ============
function navigate(page) {
  document.querySelectorAll('.pages').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navMap = {home:0, busca:1, cart:2, pedidos:3, login:4};
  if (navMap[page] !== undefined) document.querySelectorAll('.nav-item')[navMap[page]].classList.add('active');
  if (page === 'home') renderHome();
  if (page === 'cart') renderCart();
  if (page === 'pedidos') renderPedidos();
  if (page === 'login') updateAuthUI();
  window.scrollTo(0,0);
}

// ============ TOAST ============
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

// ============ API ============
async function api(path, opts={}) {
  const headers = {'Content-Type':'application/json'};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  try {
    const r = await fetch(API + path, {...opts, headers});
    return await r.json();
  } catch(e) { return {error: e.message}; }
}

// ============ AUTH ============
function updateAuthUI() {
  const text = document.getElementById('nav-user-text');
  text.textContent = usuario ? usuario.nome.split(' ')[0] : 'Entrar';
}

function showCadastro() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('cadastro-form').style.display = 'block';
  document.getElementById('auth-title').textContent = 'Cadastro';
}
function showLogin() {
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('cadastro-form').style.display = 'none';
  document.getElementById('auth-title').textContent = 'Entrar';
}

async function loginCliente() {
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  if (!email || !senha) return toast('Preencha email e senha');
  const r = await api('/api/clientes/login', {method:'POST', body:JSON.stringify({email,senha})});
  if (r.error) return toast(r.error);
  token = r.token;
  usuario = r.cliente;
  localStorage.setItem('token', token);
  localStorage.setItem('usuario', JSON.stringify(usuario));
  updateAuthUI();
  toast('Bem-vindo, ' + usuario.nome.split(' ')[0] + '! 🎉');
  navigate('home');
}

async function cadastroCliente() {
  const d = {
    nome: document.getElementById('cad-nome').value,
    email: document.getElementById('cad-email').value,
    telefone: document.getElementById('cad-telefone').value,
    endereco_padrao: document.getElementById('cad-endereco').value,
    senha: document.getElementById('cad-senha').value
  };
  if (!d.nome || !d.email || !d.senha) return toast('Preencha nome, email e senha');
  const r = await api('/api/clientes/cadastro', {method:'POST', body:JSON.stringify(d)});
  if (r.error) return toast(r.error);
  token = r.token;
  usuario = r.cliente;
  localStorage.setItem('token', token);
  localStorage.setItem('usuario', JSON.stringify(usuario));
  updateAuthUI();
  toast('Conta criada com sucesso! 🎉');
  navigate('home');
}

// ============ HOME ============
async function renderHome() {
  // Categorias
  const catList = document.getElementById('cat-list');
  if (categorias.length === 0) {
    const r = await api('/api/categorias');
    if (r.categorias) categorias = r.categorias;
  }
  catList.innerHTML = categorias.map(c => 
    `<div class="cat-item" onclick="buscarCategoria('${c.nome}')">
      <div class="icon">${c.icone || '🏪'}</div>
      <div class="name">${c.nome}</div>
    </div>`
  ).join('') + 
  `<div class="cat-item" onclick="navigate('busca')">
    <div class="icon">📦</div>
    <div class="name">Ver Todos</div>
  </div>`;

  // Lojas
  const r = await api('/api/lojas');
  const list = document.getElementById('store-list');
  if (!r.lojas || r.lojas.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🏪</div><h3>Nenhuma loja ainda</h3><p>Em breve lojas cadastradas aparecerão aqui</p></div>`;
    return;
  }
  list.innerHTML = r.lojas.map(l => {
    const cats = l.categorias ? l.categorias.split(',').slice(0,3) : [];
    return `<div class="store-card" onclick="abrirLoja(${l.id})">
      <div class="store-logo">${l.logo || '🏪'}</div>
      <div class="store-info">
        <h3>${l.nome}</h3>
        <div class="meta">📍 ${l.bairro || 'São Luís'} • 🛵 R$ ${l.taxa_entrega_km || 2}/km</div>
        <div class="tags">${cats.map(c => `<span class="tag">${c.trim()}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

function buscarCategoria(cat) {
  document.getElementById('search-input').value = cat;
  navigate('busca');
  searchProducts();
}

// ============ LOJA ============
async function abrirLoja(id) {
  currentLoja = id;
  const r = await api('/api/lojas/' + id);
  if (r.error) return toast(r.error);
  document.getElementById('loja-nome-header').textContent = r.loja.nome;
  document.getElementById('loja-info').innerHTML = `
    <div style="padding:16px;display:flex;gap:12px;background:var(--branco);margin:0 16px 8px;border-radius:16px">
      <div style="font-size:48px">${r.loja.logo || '🏪'}</div>
      <div>
        <h2 style="font-size:18px">${r.loja.nome}</h2>
        <p style="color:var(--texto-sec);font-size:13px">${r.loja.descricao || ''}</p>
        <p style="font-size:12px;color:var(--texto-sec);margin-top:4px">📍 ${r.loja.endereco || ''} ${r.loja.bairro || ''}</p>
        <p style="font-size:12px;color:var(--texto-sec)">🛵 Frete: R$ ${r.loja.taxa_entrega_km || 2}/km • ${r.loja.tempo_entrega_min || '30-60 min'}</p>
        ${r.loja.whatsapp ? `<p style="font-size:12px;color:var(--verde)">📱 WhatsApp: ${r.loja.whatsapp}</p>` : ''}
      </div>
    </div>
  `;
  document.getElementById('produtos-list').innerHTML = r.produtos.map(p => `
    <div class="product-card">
      <div class="product-img">${p.foto || '📦'}</div>
      <div class="product-info">
        <h4>${p.nome}</h4>
        <div class="loja-nome">${p.marca || ''}</div>
        <div class="preco">R$ ${p.preco.toFixed(2)}</div>
        <button class="btn-add" onclick="addToCart(${p.id},'${p.nome}',${p.preco},${r.loja.id},'${r.loja.nome}')">+ Adicionar</button>
      </div>
    </div>
  `).join('');
  navigate('loja');
}

// ============ BUSCA ============
async function searchProducts() {
  const q = document.getElementById('search-input').value;
  if (!q) { document.getElementById('search-results').innerHTML = ''; return; }
  const r = await api('/api/produtos?busca=' + encodeURIComponent(q));
  if (!r.produtos || r.produtos.length === 0) {
    document.getElementById('search-results').innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>Nada encontrado</h3><p>Tente outro termo</p></div>`;
    return;
  }
  document.getElementById('search-results').innerHTML = `
    <div class="section-title">${r.produtos.length} resultado(s)</div>
    <div class="product-grid">${r.produtos.map(p => `
      <div class="product-card">
        <div class="product-img">${p.foto || '📦'}</div>
        <div class="product-info">
          <h4>${p.nome}</h4>
          <div class="loja-nome">${p.loja_nome || ''}</div>
          <div class="preco">R$ ${p.preco.toFixed(2)}</div>
          <button class="btn-add" onclick="addToCart(${p.id},'${p.nome.replace(/'/g,"\\'")}',${p.preco},${p.loja_id},'${(p.loja_nome||'').replace(/'/g,"\\'")}')">+ Adicionar</button>
        </div>
      </div>
    `).join('')}</div>`;
}

// ============ CART ============
function addToCart(prodId, nome, preco, lojaId, lojaNome) {
  if (cart.length > 0 && cart[0].loja_id !== lojaId) {
    return toast('Finalize o pedido da loja atual antes de comprar de outra');
  }
  const existing = cart.find(i => i.id === prodId);
  if (existing) { existing.qty++; }
  else { cart.push({id:prodId, nome, preco, qty:1, loja_id:lojaId, loja_nome:lojaNome}); }
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartBadge();
  toast(`${nome} adicionado ao carrinho 🛒`);
}

function updateCartBadge() {
  const badge = document.getElementById('cart-badge');
  const total = cart.reduce((s,i) => s + i.qty, 0);
  if (total > 0) { badge.textContent = total; badge.style.display = 'flex'; }
  else badge.style.display = 'none';
}

function renderCart() {
  const el = document.getElementById('cart-content');
  if (cart.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">🛒</div><h3>Carrinho vazio</h3><p>Adicione produtos das lojas</p></div>`;
    return;
  }
  const subtotal = cart.reduce((s,i) => s + i.preco * i.qty, 0);
  el.innerHTML = `
    <div style="padding:12px 16px;font-size:13px;color:var(--texto-sec)">
      🏪 Pedido de: <strong>${cart[0].loja_nome}</strong>
    </div>
    ${cart.map((i,idx) => `
      <div class="cart-item">
        <div class="info">
          <h4>${i.nome}</h4>
          <div class="preco">R$ ${(i.preco * i.qty).toFixed(2)}</div>
        </div>
        <div class="qty">
          <button onclick="cartQty(${idx},-1)">−</button>
          <span>${i.qty}</span>
          <button onclick="cartQty(${idx},1)">+</button>
        </div>
      </div>
    `).join('')}
    <div class="cart-resumo">
      <div class="row"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2)}</span></div>
      <div class="row total"><span>Total</span><span>R$ ${subtotal.toFixed(2)}</span></div>
    </div>
    <div style="padding:0 16px;display:flex;gap:8px">
      <button class="btn btn-danger btn-sm" onclick="limparCart()" style="flex:1">🔄 Limpar</button>
      <button class="btn btn-primary btn-sm" onclick="irCheckout()" style="flex:2">Continuar ➡️</button>
    </div>
  `;
}

function cartQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartBadge();
  renderCart();
}

function limparCart() {
  cart = [];
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartBadge();
  renderCart();
  toast('Carrinho limpo');
}

// ============ CHECKOUT ============
function irCheckout() {
  if (!usuario) return toast('Faça login primeiro');
  if (cart.length === 0) return toast('Carrinho vazio');
  const subtotal = cart.reduce((s,i) => s + i.preco * i.qty, 0);
  const frete = 5; // placeholder
  document.getElementById('checkout-resumo').innerHTML = `
    <div class="row"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2)}</span></div>
    <div class="row" id="frete-row"><span>🛵 Frete (estimado)</span><span>R$ ${frete.toFixed(2)}</span></div>
    <div class="row total"><span>Total</span><span>R$ ${(subtotal+frete).toFixed(2)}</span></div>
  `;
  toggleTipoEntrega();
  navigate('checkout');
}

function toggleTipoEntrega() {
  const tipo = document.getElementById('tipo-entrega').value;
  document.getElementById('endereco-group').style.display = tipo === 'entrega' ? 'block' : 'none';
  const frete = tipo === 'entrega' ? 5 : 0;
  const subtotal = cart.reduce((s,i) => s + i.preco * i.qty, 0);
  document.getElementById('frete-row').innerHTML = `<span>🛵 Frete</span><span>R$ ${frete.toFixed(2)}</span>`;
  document.querySelector('#checkout-resumo .total span:last-child').textContent = `R$ ${(subtotal+frete).toFixed(2)}`;
}

async function finalizarPedido() {
  if (!usuario) return toast('Faça login primeiro');
  const tipo = document.getElementById('tipo-entrega').value;
  const endereco = document.getElementById('endereco-entrega').value;
  const obs = document.getElementById('observacao').value;
  const pagamento = document.getElementById('forma-pagamento').value;
  if (tipo === 'entrega' && !endereco) return toast('Informe o endereço de entrega');

  const subtotal = cart.reduce((s,i) => s + i.preco * i.qty, 0);
  const frete = tipo === 'entrega' ? 5 : 0;

  const r = await api('/api/pedidos', {
    method:'POST',
    body:JSON.stringify({
      loja_id: cart[0].loja_id,
      itens: cart.map(i => ({id:i.id, nome:i.nome, preco:i.preco, qty:i.qty})),
      total_produtos: subtotal,
      taxa_entrega: frete,
      tipo_entrega: tipo,
      endereco_entrega: endereco || 'Retirada na loja',
      forma_pagamento: pagamento,
      observacao: obs
    })
  });
  if (r.error) return toast(r.error);
  cart = [];
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartBadge();
  toast('Pedido realizado com sucesso! 🎉');
  navigate('pedidos');
}

// ============ PEDIDOS ============
async function renderPedidos() {
  if (!usuario) {
    document.getElementById('pedidos-list').innerHTML = `<div class="empty-state"><div class="icon">🔒</div><h3>Faça login</h3><p>Entre para ver seus pedidos</p></div>`;
    return;
  }
  const r = await api('/api/pedidos/cliente/' + usuario.id);
  if (!r.pedidos || r.pedidos.length === 0) {
    document.getElementById('pedidos-list').innerHTML = `<div class="empty-state"><div class="icon">📋</div><h3>Nenhum pedido</h3><p>Seus pedidos aparecerão aqui</p></div>`;
    return;
  }
  const statusLabel = {'aguardando':'⏳ Aguardando','confirmado':'✅ Confirmado','saiu_entrega':'🛵 Saiu para entrega','entregue':'📦 Entregue','cancelado':'❌ Cancelado'};
  document.getElementById('pedidos-list').innerHTML = r.pedidos.map(p => `
    <div class="order-card">
      <span class="status status-${p.status}">${statusLabel[p.status] || p.status}</span>
      <h3>🏪 ${p.loja_nome}</h3>
      <p style="font-size:13px;color:var(--texto-sec);margin:4px 0">${p.data_pedido}</p>
      <p style="font-size:14px;font-weight:600">Total: R$ ${p.total_final.toFixed(2)}</p>
      <p style="font-size:12px;color:var(--texto-sec)">${p.tipo_entrega === 'entrega' ? '🛵 Entrega' : '🏪 Retirada'} • ${p.forma_pagamento}</p>
      ${p.codigo_retirada ? `<p style="font-size:14px;font-weight:700;color:var(--laranja);margin-top:4px">Código: ${p.codigo_retirada}</p>` : ''}
    </div>
  `).join('');
}

// ============ INIT ============
updateAuthUI();
updateCartBadge();
renderHome();
</script>

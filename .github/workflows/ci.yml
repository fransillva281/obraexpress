name: Verificar ObraMobi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obraexpress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d obraexpress_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/obraexpress_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/obraexpress_test
      PGSSLMODE: disable
      JWT_SECRET: segredo-exclusivo-do-ambiente-de-testes-automaticos
      ADMIN_EMAIL: admin-testes@example.invalid
      ADMIN_PASSWORD: senha-exclusiva-de-testes
      APP_STAGE: test
      PAYMENT_MODE: mock

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências travadas
        run: npm ci
      - name: Conferir sintaxe e testes
        run: npm run ci
      - name: Conferir vulnerabilidades conhecidas
        run: npm audit --omit=dev --audit-level=high
